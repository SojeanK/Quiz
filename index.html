<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spooky Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            color: #666666;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(40, 40, 40, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 70%, rgba(30, 30, 30, 0.2) 0%, transparent 50%),
                radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
            animation: ambiance 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(to bottom, rgba(20, 20, 20, 0.4) 0%, transparent 15%, transparent 85%, rgba(20, 20, 20, 0.4) 100%),
                linear-gradient(to right, rgba(20, 20, 20, 0.4) 0%, transparent 15%, transparent 85%, rgba(20, 20, 20, 0.4) 100%);
            backdrop-filter: blur(3px);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes ambiance {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: transparent;
            border: none;
            box-shadow: none;
            position: relative;
            z-index: 100;
        }

        .question {
            font-size: 1.5em;
            margin-bottom: 40px;
            line-height: 1.5;
            color: #888888;
            text-shadow: 0 0 15px rgba(80, 80, 80, 0.6);
            animation: textPulse 4s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { 
                opacity: 0.9;
                text-shadow: 0 0 15px rgba(80, 80, 80, 0.6);
            }
            50% { 
                opacity: 1;
                text-shadow: 0 0 25px rgba(100, 100, 100, 0.8);
            }
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        button {
            padding: 20px 40px;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            background: #0d0d0d;
            color: #777777;
            border: 1px solid #333333;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 2px 15px rgba(0, 0, 0, 0.8);
        }

        button:hover {
            background: #1a1a1a;
            color: #999999;
            transform: scale(1.01);
            box-shadow: 0 0 40px rgba(80, 80, 80, 0.3), inset 0 0 30px rgba(50, 50, 50, 0.4);
            border-color: #444444;
        }

        .jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: shake 0.5s infinite;
        }

        .jumpscare.active {
            display: flex;
        }

        .jumpscare img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 10px) rotate(-2deg); }
            50% { transform: translate(10px, -10px) rotate(2deg); }
            75% { transform: translate(-10px, -10px) rotate(-1deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="quiz">
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
    </div>

    <div class="jumpscare" id="jumpscare">
        <img id="scareImage" src="" alt="JUMPSCARE!">
    </div>

    <audio id="bgMusic" loop>
        <source src="background-music.mp3" type="audio/mpeg">
        <source src="background-music.wav" type="audio/wav">
        <source src="background-music.m4a" type="audio/mp4">
    </audio>
    <audio id="clickSound">
        <source src="click-sound.mp3" type="audio/mpeg">
        <source src="click-sound.wav" type="audio/wav">
        <source src="click-sound.m4a" type="audio/mp4">
    </audio>
    <audio id="scareMusic">
        <source src="scare-music.mp3" type="audio/mpeg">
        <source src="scare-music.wav" type="audio/wav">
        <source src="scare-music.m4a" type="audio/mp4">
    </audio>

    <script>
        const questions = [
            {
                text: "You're alone in a dark forest. What frightens you most?",
                options: ["The unknown in the darkness", "Being watched by something"]
            },
            // Question 2 will be dynamically selected based on Q1 answer
            {
                0: { // If they chose "unknown in darkness"
                    text: "You hear strange sounds getting closer. Do you...",
                    options: ["Hide and stay silent", "Call out to see what it is"]
                },
                1: { // If they chose "being watched"
                    text: "You feel eyes on you from the shadows. Do you...",
                    options: ["Confront whatever is watching", "Try to escape quickly"]
                }
            },
            // Question 3 will be dynamically selected based on Q1 answer
            {
                0: { // If they chose "unknown in darkness"
                    text: "Something touches your shoulder in the dark. Do you...",
                    options: ["Freeze in terror", "Spin around aggressively"]
                },
                1: { // If they chose "being watched"
                    text: "A figure steps out from behind a tree. Do you...",
                    options: ["Make eye contact", "Look away and run"]
                }
            }
        ];

        const jumpscares = [
            "jumpscare1", // Path 1: 0 points
            "jumpscare2", // Path 2: 1 point
            "jumpscare3", // Path 3: 2 points
            "jumpscare4", // Path 4: 3 points
            "jumpscare5", // Path 5: 4 points
            "jumpscare6", // Path 6: 5 points
            "jumpscare7", // Path 7: 6 points
            "jumpscare8" // Path 8: 7 points
        ];

        // Try multiple image formats
        function loadImage(baseName) {
            const extensions = ['.JPG', '.jpg', '.JPEG', '.jpeg', '.PNG', '.png', '.GIF', '.gif', '.webp'];
            const img = new Image();
            
            function tryNextFormat(index) {
                if (index >= extensions.length) {
                    console.error('Could not load image:', baseName);
                    return;
                }
                
                img.src = baseName + extensions[index];
                img.onerror = () => tryNextFormat(index + 1);
            }
            
            tryNextFormat(0);
            return img.src;
        }

        let currentQuestion = 0;
        let answers = [];
        
        const bgMusic = document.getElementById('bgMusic');
        const clickSound = document.getElementById('clickSound');
        const scareMusic = document.getElementById('scareMusic');
        
        bgMusic.volume = 0.3;
        clickSound.volume = 0.5;
        scareMusic.volume = 0;
        
        // Try to start background music immediately
        bgMusic.play().catch(e => {
            console.log('Autoplay blocked - will start on first interaction:', e);
            // If autoplay is blocked, start on first click
            document.addEventListener('click', function startOnClick() {
                bgMusic.play();
                document.removeEventListener('click', startOnClick);
            }, { once: true });
        });

        function displayQuestion() {
            const questionEl = document.getElementById('question');
            const optionsEl = document.getElementById('options');
            
            let questionData;
            
            // First question is straightforward
            if (currentQuestion === 0) {
                questionData = questions[0];
            } else {
                // Questions 2 and 3 depend on the first answer
                questionData = questions[currentQuestion][answers[0]];
            }
            
            questionEl.textContent = questionData.text;
            optionsEl.innerHTML = '';
            
            questionData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.textContent = option;
                btn.onclick = () => selectAnswer(index);
                optionsEl.appendChild(btn);
            });
        }

        function selectAnswer(choice) {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log('Click sound failed:', e));
            
            answers.push(choice);
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                displayQuestion();
            } else {
                triggerJumpscare();
            }
        }

        function triggerJumpscare() {
            // Calculate which jumpscare based on binary path through answers
            // Each answer is 0 or 1, creating a unique path from 0-7
            const score = answers[0] * 1 + answers[1] * 2 + answers[2] * 4;
            const scareIndex = score % 8;
            
            const quizEl = document.getElementById('quiz');
            const jumpscareEl = document.getElementById('jumpscare');
            const scareImage = document.getElementById('scareImage');
            
            quizEl.style.display = 'none';
            scareImage.src = loadImage(jumpscares[scareIndex]);
            
            // Fade out background music and start building scare music
            bgMusic.volume = 0.1;
            scareMusic.currentTime = 0;
            scareMusic.play().catch(e => console.log('Scare music failed:', e));
            
            // Gradually increase scare music volume
            let volume = 0;
            const volumeInterval = setInterval(() => {
                volume += 0.1;
                if (volume >= 0.8) {
                    clearInterval(volumeInterval);
                }
                scareMusic.volume = Math.min(volume, 0.8);
            }, 50);
            
            setTimeout(() => {
                jumpscareEl.classList.add('active');
            }, 500);
            
            setTimeout(() => {
                clearInterval(volumeInterval);
                jumpscareEl.classList.remove('active');
                scareMusic.pause();
                scareMusic.currentTime = 0;
                bgMusic.volume = 0.3;
                quizEl.style.display = 'block';
                currentQuestion = 0;
                answers = [];
                displayQuestion();
            }, 10000); // Extended to 10 seconds for debugging
        }

        displayQuestion();
    </script>
</body>
</html>
